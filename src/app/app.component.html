<div *ngIf="showSidebar; else simpleContent" class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <app-sidebar></app-sidebar>

        <!-- Main content area -->
        <main class="col main-content">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center mb-3">
                <h2 class="h4 font-weight-bold">{{ pageTitle }}</h2>
                <div class="d-flex align-items-center">
                    <div class="me-3 text-end d-flex align-items-center">
                        <!-- <i class="fa-regular fa-user me-2" style="color: gray"></i> -->
                        <span class="navbar-text me-2">{{ username }}</span>
                        <span class="text-muted small">{{ getCurrentDate() }}</span>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary logout-button" (click)="logout()">
                        <!-- Logout button with custom class -->
                        <i class="fa fa-sign-out"></i>
                    </button>
                </div>
            </div>
            <router-outlet></router-outlet>
        </main>
    </div>
</div>

<ng-template #simpleContent>
    <router-outlet></router-outlet>
</ng-template>
