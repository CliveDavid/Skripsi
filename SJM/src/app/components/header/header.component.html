<header>
  <nav class="navbar navbar-expand-lg navbar-light border-bottom">
    <div class="container">
      <a class="navbar-brand me-5" href="#">
        <img src="assets/images/SJM.png" alt="SJM" class="img-fluid logo">
      </a>
      <div class="collapse navbar-collapse justify-content-center">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="#">
              Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="#">
              Orders</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="#">
              Contact</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold" href="#">
              Profile</a>
          </li>
        </ul>
      </div>
      <div class="d-flex align-items-center">
        <ng-container *ngIf="!(isLoggedIn$ | async); else loggedInButtons">
          <a routerLink="/login" class="btn btn-sm btn-outline-secondary me-2 no-border rounded-0">Log In</a>
          <a routerLink="/register" class="btn btn-sm btn-primary me-3 no-border rounded-0">Register</a>
        </ng-container>
        <ng-template #loggedInButtons>
          <a href="#" class="position-relative d-flex align-items-center ms-3 my-icon" (click)="showNotifications()">
            <i class="fas fa-bell my-icon-fa"></i>
            <span class="position-absolute translate-middle badge rounded-pill bg-danger icon-badge">3</span>
          </a>
          <div class="dropdown" ngbDropdown>
            <a class="position-relative d-flex align-items-center ms-4 my-icon" ngbDropdownToggle id="profileDropdown"
              role="button">
              <i class="fas fa-user my-icon-fa"></i>
            </a>
            <ul ngbDropdownMenu aria-labelledby="profileDropdown" class="dropdown-menu dropdown-menu-end">
              <li><a ngbDropdownItem routerLink="/order-history" class="dropdown-item">
                  <i class="fas fa-history"></i>
                  <span>Order History</span>
                  <i class="fas fa-chevron-right"></i>
                </a></li>
              <li><a ngbDropdownItem routerLink="/edit-profile" class="dropdown-item">
                  <i class="fas fa-user-edit"></i>
                  <span>Edit Profile</span>
                  <i class="fas fa-chevron-right"></i>
                </a></li>
              <li><a ngbDropdownItem href="#" (click)="logout()" class="dropdown-item">
                  <i class="fas fa-sign-out-alt"></i>
                  <span>Logout</span>
                  <i class="fas fa-chevron-right"></i>
                </a></li>
            </ul>
          </div>
        </ng-template>
      </div>
    </div>
  </nav>

  <div class="border-bottom second-row">
    <div class="container px-3 py-2 d-flex justify-content-between align-items-center">
      <div class="dropdown">
        <button class="btn btn-link dropdown-toggle fw-semibold text-dark text-decoration-none" type="button"
          id="dropdownMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
          {{ selectedType }}
          <i class="fas fa-chevron-down ms-1"></i>
        </button>
        <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton">
          <li><a class="dropdown-item" href="#" (click)="selectProductType('all', 'All Products')">All Products</a></li>
          <li *ngFor="let type of productTypes">
            <a class="dropdown-item" href="#" (click)="selectProductType(type.value, type.label)">{{ type.label }}</a>
          </li>
        </ul>
      </div>

      <form class="d-flex w-75 position-relative" (ngSubmit)="onSearch()">
        <i class="fas fa-search search-icon"></i>
        <input class="form-control ps-5 border-bottom-only" type="search" placeholder="Search for..."
          aria-label="Search" [(ngModel)]="searchTerm" name="search">
      </form>

      <a routerLink="/cart" class="position-relative d-flex align-items-center ms-3 my-icon">
        <i class="fas fa-shopping-cart my-icon-fa"></i>
        <span class="ms-2 fw-semibold my-icon-text">My Cart</span>
        <span
          class="position-absolute translate-middle badge rounded-pill bg-danger icon-badge">{{ cartItemCount }}</span>
      </a>
    </div>
  </div>
</header>

<app-toastr></app-toastr>
