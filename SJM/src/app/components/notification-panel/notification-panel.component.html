<div class="notification-panel" [class.show]="isVisible">
  <div class="notification-header">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0">Notifications</h5>
      <div class="header-actions">
        <button class="btn btn-link" *ngIf="hasUnread" (click)="markAllAsRead()">
          Mark all as read
        </button>
        <button class="btn-close ms-2" (click)="close()"></button>
      </div>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab" [class.active]="filterType === 'unread'" (click)="filterType = 'unread'">
        Unread
      </button>
      <button class="filter-tab" [class.active]="filterType === 'all'" (click)="filterType = 'all'">
        All
      </button>
    </div>
  </div>

  <div class="notification-content">
    <ng-container *ngIf="filteredNotifications.length > 0; else noNotifications">
      <div class="notification-item" *ngFor="let notification of filteredNotifications"
        [class.unread]="notification.status === 'unread'" (click)="onNotificationClick(notification)">
        <div class="notification-item-content">
          <div class="notification-title">{{ notification.header }}</div>
          <div class="notification-message">{{ notification.message }}</div>
          <div class="notification-time">{{ formatTimeAgo(notification.createdAt) }}</div>
        </div>
        <button class="btn btn-link delete-btn" (click)="deleteNotification($event, notification.notif_id)">
          <i class="fas fa-trash-alt"></i>
        </button>
      </div>
    </ng-container>
    <ng-template #noNotifications>
      <div class="no-notifications">
        No notifications to display
      </div>
    </ng-template>
  </div>

  <div class="notification-footer" *ngIf="notifications.length > 0">
    <button class="btn btn-link text-danger" (click)="deleteAll()">
      Delete All
    </button>
  </div>
</div>

<div class="notification-overlay" [class.show]="isVisible" (click)="close()"></div>
