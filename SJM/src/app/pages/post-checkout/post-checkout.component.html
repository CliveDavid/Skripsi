<div class="post-checkout-container">
  <div class="post-checkout-message">
    <i class="fas fa-check-circle check-icon"></i>
    <h1>Thank you for ordering!</h1>
    <p>Your order number is <strong><a (click)="viewOrderDetails(orderNumber)"
          class="order-number-link">{{ orderNumber }}</a></strong>.</p>

    <h2>What's next?</h2>
    <ul>
      <li>We will send confirmation of the order and information about its progress by e-mail.</li>
      <li><a href="mailto:support@company.com">Please feel free to contact us</a> if you have any questions.</li>
    </ul>

    <button class="home-btn" (click)="goHome()">HOME</button>
  </div>
</div>
