<div class="container">
  <div class="px-3">
    <h1>{{ pageTitle }}</h1>
    <p>{{ pageDescription }}</p>
  </div>
  <div class="product-grid">
    <app-product-card *ngFor="let product of filteredProducts" [product]="product" (click)="openProductDetail(product)">
    </app-product-card>
  </div>
</div>
<app-product-detail *ngIf="selectedProduct" [product]="selectedProduct" (close)="closeProductDetail()">
</app-product-detail>

<app-toastr></app-toastr>
