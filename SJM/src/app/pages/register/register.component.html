<div class="auth-content">
  <div class="auth-form">
    <div class="form-container">
      <h1 class="fw-bold mt-5">Sign Up</h1>
      <div class="stepper" [style.--progress-width]="progressWidth">
        <div class="step" [class.active]="currentStep === 1" [class.completed]="step1Completed">
          <div class="step-circle"></div>
          <div class="step-content">
            <div class="step-title">1. Account Information</div>
            <div class="step-status" *ngIf="currentStep === 1 && !step1Completed">Incomplete</div>
            <div class="step-status completed" *ngIf="step1Completed">Completed</div>
          </div>
        </div>
        <div class="step" [class.active]="currentStep === 2" [class.completed]="step2Completed">
          <div class="step-circle"></div>
          <div class="step-content">
            <div class="step-title">2. Address Information</div>
            <div class="step-status" *ngIf="currentStep === 2 && !step2Completed">Incomplete</div>
            <div class="step-status completed" *ngIf="step2Completed">Completed</div>
          </div>
        </div>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div *ngIf="currentStep === 1">
          <div class="form-group">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" [(ngModel)]="firstName"
              placeholder="Enter your first name" required>
          </div>
          <div class="form-group">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" [(ngModel)]="lastName" placeholder="Enter your last name"
              required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                placeholder="Enter your password" required>
              <span class="password-toggle" (click)="togglePasswordVisibility()">👁️</span>
            </div>
          </div>
          <div class="form-group">
            <label class="checkbox-container">
              <input type="checkbox" name="terms" [(ngModel)]="acceptTerms">
              <span class="checkmark"></span>
              I agree to the Terms and Conditions
            </label>
          </div>
        </div>
        <div *ngIf="currentStep === 2">
          <div class="form-group">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" [(ngModel)]="address" placeholder="Enter your address"
              required>
          </div>
        </div>
        <button type="button" class="submit-btn" (click)="nextStep()" *ngIf="currentStep === 1">Continue</button>
        <button type="submit" class="submit-btn" *ngIf="currentStep === 2">Sign Up</button>
      </form>
      <p class="login-link">Already have an account? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
