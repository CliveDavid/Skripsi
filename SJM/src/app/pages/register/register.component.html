<div class="auth-content">
  <div class="auth-form">
    <div class="form-container">
      <h1 class="fw-bold mt-5">Sign Up</h1>
      <div class="stepper" [style.--progress-width]="progressWidth">
        <div class="step" [class.active]="currentStep === 1" [class.completed]="step1Completed">
          <div class="step-circle"></div>
          <div class="step-content">
            <div class="step-title">1. Account Information</div>
            <div class="step-status" *ngIf="currentStep === 1 && !step1Completed">Incomplete</div>
            <div class="step-status completed" *ngIf="step1Completed">Completed</div>
          </div>
        </div>
        <div class="step" [class.active]="currentStep === 2" [class.completed]="step2Completed">
          <div class="step-circle"></div>
          <div class="step-content">
            <div class="step-title">2. Address Information</div>
            <div class="step-status" *ngIf="currentStep === 2 && !step2Completed">Incomplete</div>
            <div class="step-status completed" *ngIf="step2Completed">Completed</div>
          </div>
        </div>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div *ngIf="currentStep === 1">
          <!-- Account Information -->
          <div class="form-group">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" [(ngModel)]="firstName"
              placeholder="Enter your first name" required>
          </div>
          <div class="form-group">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" [(ngModel)]="lastName" placeholder="Enter your last name"
              required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
            <div *ngIf="emailError" class="error-message">{{ emailError }}</div>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
                placeholder="Enter your password" required>
              <span class="password-toggle" (click)="togglePasswordVisibility()">👁️</span>
            </div>
            <div *ngIf="passwordError" class="error-message">{{ passwordError }}</div>
            <p *ngIf="!passwordError" class="password-hint">It must be a combination of minimum 8 letters, numbers, and
              symbols.</p>
          </div>
          <div class="form-group">
            <label class="checkbox-container">
              <input type="checkbox" name="terms" [(ngModel)]="acceptTerms">
              <span class="checkmark"></span>
              I agree to the Terms and Conditions
            </label>
          </div>
        </div>

        <!-- Address Information -->
        <div *ngIf="currentStep === 2">
          <div class="form-group">
            <label for="province">Province</label>
            <select id="province" [(ngModel)]="selectedProvince" (change)="onProvinceChange($event)" name="province">
              <option value="" disabled selected>Select Province</option>
              <option *ngFor="let province of provinces" [value]="province.id">{{ province.text }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="city">City</label>
            <select id="city" [(ngModel)]="selectedCity" (change)="onCityChange($event)" name="city"
              [disabled]="!selectedProvince">
              <option value="" disabled selected>Select City</option>
              <option *ngFor="let city of cities" [value]="city.id">{{ city.text }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="district">District (Kecamatan)</label>
            <select id="district" [(ngModel)]="selectedDistrict" (change)="onDistrictChange($event)" name="district"
              [disabled]="!selectedCity">
              <option value="" disabled selected>Select District</option>
              <option *ngFor="let district of districts" [value]="district.id">{{ district.text }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="subdistrict">Sub-district (Kelurahan)</label>
            <select id="subdistrict" [(ngModel)]="selectedSubdistrict" (change)="onSubdistrictChange($event)"
              name="subdistrict" [disabled]="!selectedDistrict">
              <option value="" disabled selected>Select Subdistrict</option>
              <option *ngFor="let subdistrict of subdistricts" [value]="subdistrict.id">{{ subdistrict.text }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="zipcode">Zipcode</label>
            <select id="zipcode" [(ngModel)]="selectedZipcode" name="zipcode" [disabled]="!selectedSubdistrict">
              <option value="" disabled selected>Select Zipcode</option>
              <option *ngFor="let zipcode of zipcodes" [value]="zipcode.text">{{ zipcode.text }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="address">Detailed Address</label>
            <textarea id="address" name="address" [(ngModel)]="addr_details" placeholder="Enter full address details"
              required></textarea>
          </div>
          <div class="form-group">
            <label for="phone">Phone</label>
            <div class="phone-input-container">
              <span class="phone-prefix">+62</span>
              <input type="text" id="phone" name="phone" [(ngModel)]="phoneNumber" (input)="onPhoneInput($event)"
                maxlength="13" placeholder="Enter your phone number" required>
            </div>
            <div *ngIf="phoneError" class="error-message">{{ phoneError }}</div>
          </div>
        </div>

        <!-- Buttons for navigation -->
        <button type="button" class="submit-btn" (click)="nextStep()" *ngIf="currentStep === 1">Continue</button>
        <button type="submit" class="submit-btn" *ngIf="currentStep === 2">Register</button>
      </form>
      <p class="login-link">Already have an account? <a routerLink="/login">Log In</a></p>
    </div>
  </div>
</div>
