<div class="order-history-container">
  <div class="order-list">
    <h1 class="fw-bold">Shipments</h1>

    <div class="tabs">
      <button [class.active]="activeTab === 'upcoming'" (click)="setActiveTab('upcoming')">UPCOMING</button>
      <button [class.active]="activeTab === 'history'" (click)="setActiveTab('history')">HISTORY</button>
    </div>

    <div class="shipments-list">
      <div class="shipment-item" *ngFor="let order of displayedOrders" (click)="viewOrderDetails(order.id)">
        <div class="shipment-info">
          <h3>{{ order.status }} on {{ order.date }}</h3>
          <p>{{ order.items }} items • ${{ order.total.toFixed(2) }}</p>
        </div>
        <span class="chevron">›</span>
      </div>
    </div>

    <div class="support-section">
      <h2>Got questions? Message Support</h2>
      <p>Our friendly support team is here for questions about billing, shipping, and account changes.</p>
      <p class="response-time">24 hour response time</p>
      <button class="support-button">MESSAGE SUPPORT</button>
    </div>
  </div>
</div>

<app-toastr></app-toastr>
