<div class="auth-content">
  <div class="auth-form">
    <div class="logo">
      <img src="../../../assets/images/SJM.png" alt="SJM Logo" class="auth-logo">
    </div>
    <div class="form-container">
      <h1>Log In</h1>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input [type]="showPassword ? 'text' : 'password'" id="password" name="password" [(ngModel)]="password"
              placeholder="Enter your password" required>
            <span class="password-toggle" (click)="togglePasswordVisibility()">👁️</span>
          </div>
          <p class="password-hint">It must be a combination of minimum 8 letters, numbers, and symbols.</p>
        </div>
        <div class="form-group">
          <label class="checkbox-container">
            <input type="checkbox" name="remember" [(ngModel)]="rememberMe">
            <span class="checkmark"></span>
            Remember me
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <button type="submit" class="submit-btn">Log In</button>
      </form>
      <p class="signup-link">No account yet? <a routerLink="/register">Sign Up</a></p>
    </div>
    <div class="auth-footer">
      <p>&copy; 2024 SJM. All rights reserved.</p>
    </div>
  </div>
</div>
