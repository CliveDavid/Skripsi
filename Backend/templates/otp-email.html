<!DOCTYPE html>
<html>

<head>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f7f7f7;
        }

        .header {
            background-color: #012160;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            background-color: white;
            padding: 20px;
            border-radius: 0 0 5px 5px;
        }

        .otp-container {
            margin: 20px 0;
            text-align: center;
        }

        .otp-code {
            font-size: 32px;
            font-weight: bold;
            color: #012160;
            letter-spacing: 5px;
            background-color: #f0f7ff;
            padding: 15px 25px;
            border-radius: 5px;
            border: 2px dashed #012160;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h2>Email Verification</h2>
        </div>
        <div class="content">
            <p>Dear {{name}},</p>
            <p>Please use the following OTP code to verify your email address:</p>

            <div class="otp-container">
                <div class="otp-code">{{otp}}</div>
            </div>

            <p>This code will expire in <strong>15 minutes</strong>.</p>
            <p>If you didn't request this code, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>Best regards,<br>PT Sadang Jaya Makmur</p>
        </div>
    </div>
</body>

</html>
