<!DOCTYPE html>
<html>

<head>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f7f7f7;
        }

        .header {
            background-color: #012160;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            background-color: white;
            padding: 20px;
            border-radius: 0 0 5px 5px;
        }

        .message-content {
            background-color: #f0f7ff;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
            white-space: pre-line;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h2>Support Request</h2>
        </div>
        <div class="content">
            <p><strong>From:</strong> {{email}}</p>
            <p><strong>Subject:</strong> {{subject}}</p>
            <p><strong>Message:</strong></p>
            <div class="message-content">{{message}}</div>
        </div>
        <div class="footer">
            <p>This message was sent via the support system</p>
        </div>
    </div>
</body>

</html>
