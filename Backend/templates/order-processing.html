<!DOCTYPE html>
<html>

<head>
    <style>
        .email-container {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f7f7f7;
        }

        .header {
            background-color: #012160;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 5px 5px 0 0;
        }

        .content {
            background-color: white;
            padding: 20px;
            border-radius: 0 0 5px 5px;
        }

        .order-details {
            margin: 20px 0;
            padding: 15px;
            background-color: #f0f7ff;
            border-radius: 5px;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <div class="header">
            <h2>Order Update</h2>
        </div>
        <div class="content">
            <p>Dear {{name}},</p>
            <p>Your order #{{order_number}} is now being processed.</p>

            <div class="order-details">
                <p><strong>Order Details:</strong></p>
                <p>Order Date: {{order_date}}</p>
                <p>Total Amount: Rp {{total_price}}</p>
            </div>

            <p>Thank you for your business!</p>
        </div>
        <div class="footer">
            <p>Best regards,<br>PT Sadang Jaya</p>
        </div>
    </div>
</body>

</html>
