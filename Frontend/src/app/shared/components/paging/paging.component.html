<div class="card">
  <!-- Card Header -->
  <div class="card-header d-flex justify-content-between align-items-center">
    <span class="table-title">{{ tableTitle }}</span>
    <div class="header-controls">
      <div class="search-container">
        <input type="text" class="form-control search-input" placeholder="Search..." [(ngModel)]="searchText"
          (input)="filterData()">
        <i class="fas fa-search search-icon"></i>
      </div>
      <a *ngIf="addButton" [routerLink]="[currentRoute + '/form']" class="btn btn-add btn-sm">
        <i class="fas fa-plus"></i> Add
      </a>
    </div>
  </div>
  <!-- Table -->
  <div class="table-container">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th *ngFor="let column of columns" [ngClass]="column.alignment" (click)="sortData(column)">
              {{ column.header }}
              <i *ngIf="sortedColumn === column.field" class="fas" [ngClass]="{
              'fa-sort-up': sortOrder === 'asc',
              'fa-sort-down': sortOrder === 'desc'
            }"></i>
            </th>
            <th *ngIf="editButton">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of paginatedData(); let i = index">
            <td>{{ (currentPage - 1) * rowsPerPage + i + 1 }}</td>
            <td *ngFor="let column of columns" [ngClass]="column.alignment">
              <ng-container [ngSwitch]="column.type">
                <span *ngSwitchCase="'int'" [ngClass]="column.alignment">{{ row[column.field] | number:'1.0-0' }}</span>
                <span *ngSwitchCase="'text'" [ngClass]="column.alignment"
                  [innerHTML]="row[column.field] | highlight: searchText"></span>
                <span *ngSwitchCase="'currency'"
                  [ngClass]="column.alignment">{{ row[column.field] | currency: 'Rp' }}</span>
                <span *ngSwitchCase="'date'" [ngClass]="column.alignment">{{ row[column.field] | dateFormat }}</span>
                <a *ngSwitchCase="'link'" [href]="row[column.field]" [ngClass]="column.alignment"
                  [innerHTML]="row[column.field] | highlight: searchText"></a>
                <span *ngSwitchCase="'boolean'"
                  [ngClass]="[column.alignment, row[column.field] ? 'boolean-yes' : 'boolean-no']">{{ row[column.field] ? 'yes' : 'no' }}</span>
              </ng-container>
            </td>
            <td *ngIf="editButton">
              <a [routerLink]="[currentRoute + '/form']" [queryParams]="{ id: row[primaryKey] }"
                class="btn btn-edit btn-sm">
                <i class="fas fa-edit"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="pagination-container">
      <button (click)="previousPage()" [disabled]="currentPage === 1">‹</button>
      Page {{ currentPage }} of {{ totalPages() }}
      <button (click)="nextPage()" [disabled]="currentPage === totalPages()">›</button>
    </div>
  </div>
</div>
<app-message></app-message>
