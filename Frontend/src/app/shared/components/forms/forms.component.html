<div class="card">
  <div class="card-header">
    <h2>{{ formTitle }}</h2>
  </div>
  <div class="card-body">
    <form (ngSubmit)="onSubmit()" #dynamicForm="ngForm">
      <div class="form-row">
        <ng-container *ngFor="let column of columns; let i = index">
          <div class="form-group" [ngClass]="{'col-md-6': !column.fullWidth, 'col-md-12': column.fullWidth}">
            <label [for]="column.field">{{ column.header }}</label>
            <ng-container [ngSwitch]="column.type">
              <input *ngSwitchCase="'text'" type="text" class="form-control" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
              <input *ngSwitchCase="'date'" type="date" class="form-control" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
              <div *ngSwitchCase="'boolean'" class="custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" [id]="column.field"
                  [(ngModel)]="formData[column.field]" [name]="column.field"
                  [disabled]="isEditMode && (column.editDisabled || false)">
                <label class="custom-control-label" [for]="column.field"></label>
              </div>
              <select *ngSwitchCase="'dropdown'" class="form-control form-select" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
                <option value="" disabled selected hidden>Select one</option>
                <option *ngFor="let option of dropdownOptions[column.field]" [value]="option.value">
                  {{option.label}}
                </option>
              </select>
            </ng-container>
          </div>
        </ng-container>
      </div>
      <div class="form-buttons">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary"
          [disabled]="!dynamicForm.form.valid">{{ submitButtonText }}</button>
      </div>
    </form>
  </div>
</div>
<app-message></app-message>
