<div class="card">
  <div class="card-header">
    <h2>{{ formTitle }}</h2>
  </div>
  <div class="card-body">
    <form (ngSubmit)="onSubmit()" #dynamicForm="ngForm">
      <div class="form-row">
        <ng-container *ngFor="let column of columns; let i = index">
          <div class="form-group" [ngClass]="{'col-md-6': !column.fullWidth, 'col-md-12': column.fullWidth}">
            <label [for]="column.field">{{ column.header }}</label>
            <ng-container [ngSwitch]="column.type">
              <input *ngSwitchCase="'text'" type="text" class="form-control" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
              <input *ngSwitchCase="'date'" type="date" class="form-control" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
              <div *ngSwitchCase="'boolean'" class="custom-control custom-switch">
                <input type="checkbox" class="custom-control-input" [id]="column.field"
                  [(ngModel)]="formData[column.field]" [name]="column.field"
                  [disabled]="isEditMode && (column.editDisabled || false)">
                <label class="custom-control-label" [for]="column.field"></label>
              </div>
              <select *ngSwitchCase="'dropdown'" class="form-control form-select" [id]="column.field" required
                [(ngModel)]="formData[column.field]" [name]="column.field"
                [disabled]="isEditMode && (column.editDisabled || false)">
                <option value="" disabled selected hidden>Select one</option>
                <option *ngFor="let option of dropdownOptions[column.field]" [value]="option.value">
                  {{option.label}}
                </option>
              </select>
              <div *ngSwitchCase="'image'" class="image-upload-dropzone mt-1" (dragover)="onDragOver($event)"
                (dragleave)="onDragLeave($event)" (drop)="onDrop($event, column.field)">
                <input type="file" [id]="column.field" (change)="onFileSelected($event, column.field)"
                  [name]="column.field" accept="image/*" hidden #fileInput>
                <div class="dropzone-content" (click)="fileInput.click()">
                  <svg version="1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="36" height="36"
                    enable-background="new 0 0 48 48">
                    <path fill="#8CBCD6"
                      d="M40,41H8c-2.2,0-4-1.8-4-4V11c0-2.2,1.8-4,4-4h32c2.2,0,4,1.8,4,4v26C44,39.2,42.2,41,40,41z" />
                    <circle fill="#B3DDF5" cx="35" cy="16" r="3" />
                    <polygon fill="#9AC9E3" points="20,16 9,32 31,32" />
                    <polygon fill="#B3DDF5" points="31,22 23,32 39,32" />
                    <circle fill="#43A047" cx="38" cy="38" r="10" />
                    <g fill="#fff">
                      <rect x="36" y="32" width="4" height="12" />
                      <rect x="32" y="36" width="12" height="4" />
                    </g>
                  </svg>
                  <p class="mt-2">Drop your image here, or <span class="browse-text">browse</span></p>
                  <p class="file-types">Supports: JPG, PNG</p>
                </div>
                <div *ngIf="imagePreview" class="image-preview">
                  <img [src]="imagePreview" alt="Image preview">
                </div>
              </div>
            </ng-container>
          </div>
        </ng-container>
      </div>
      <div class="form-buttons">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary"
          [disabled]="!dynamicForm.form.valid">{{ submitButtonText }}</button>
      </div>
    </form>
  </div>
</div>
<app-message></app-message>
