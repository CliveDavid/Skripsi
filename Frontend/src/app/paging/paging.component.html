<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span>{{ tableTitle }}</span>
    <a *ngIf="addButton" [routerLink]="['/form', { id: 0 }]" class="btn btn-add btn-sm">
      <i class="fas fa-plus"></i> Add
    </a>
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>No</th>
          <th *ngFor="let column of columns" [ngClass]="column.alignment" (click)="sortData(column)">
            {{ column.header }}
            <i *ngIf="sortedColumn === column.field" class="fas" [ngClass]="{
              'fa-sort-up': sortOrder === 'asc',
              'fa-sort-down': sortOrder === 'desc'
            }"></i>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of data; let i = index">
          <td>{{ i + 1 }}</td>
          <td *ngFor="let column of columns" [ngClass]="column.alignment">
            <ng-container [ngSwitch]="column.type">
              <span *ngSwitchCase="'text'">{{ row[column.field] }}</span>
              <span *ngSwitchCase="'currency'">{{ row[column.field] | currency }}</span>
              <span *ngSwitchCase="'date'">{{ row[column.field] | dateFormat }}</span>
              <a *ngSwitchCase="'link'" [href]="row[column.field]">{{ row[column.field] }}</a>
            </ng-container>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
