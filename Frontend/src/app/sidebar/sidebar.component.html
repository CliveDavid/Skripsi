<nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse">
    <div class="position-sticky">
        <div class="sidebar-header">
            <img src="../../assets/images/SJM.png" alt="Logo" class="img-fluid sidebar-logo">
        </div>
        <ul class="nav flex-column">
            <li *ngFor="let item of sidebarItems" class="nav-item">
                <a class="nav-link d-flex align-items-center justify-content-between"
                    [class.active]="currentRoute === item.route" [routerLink]="item.route">
                    <span>
                        <i class="fa" [ngClass]="item.icon"></i> {{ item.label }}
                    </span>
                    <i *ngIf="currentRoute === item.route" class="fa fa-angle-right ml-auto"></i>
                </a>
            </li>
        </ul>
    </div>
</nav>
