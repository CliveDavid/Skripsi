<app-forms [formTitle]="'Distributor Form'" [columns]="[
    { header: 'Email', field: 'email', type: 'text', fullWidth: true, editDisabled: true },
    { header: 'Name', field: 'name', type: 'text', fullWidth: true },
    { header: 'Password', field: 'password', type: 'text', editDisabled: true, fullWidth: true },
    { header: 'Phone', field: 'phone', type: 'text', fullWidth: true },
    { header: 'Address', field: 'address', type: 'text', fullWidth: true },
    { header: 'Address Details', field: 'addr_details', type: 'text', fullWidth: true },
    { header: 'City', field: 'city', type: 'text', fullWidth: true },
    { header: 'Province', field: 'province', type: 'text', fullWidth: true },
    { header: 'Zipcode', field: 'zipcode', type: 'text', fullWidth: true },
    { header: 'Active', field: 'is_active', type: 'boolean', fullWidth: true },
  ]" [submitUrl]="BASE_URL + '/distributor'" [submitButtonText]="'Save'"
  [fetchUrl]="BASE_URL + '/distributor/get-by-id'">
</app-forms>
