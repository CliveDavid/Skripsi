<app-paging [tableTitle]="'Product Records'" [addButton]="true" [columns]="[
      { header: 'ID', field: 'prod_id', alignment: 'left', type: 'text' },
      { header: 'Product Code', field: 'prod_code', alignment: 'left', type: 'text' },
      { header: 'Product Name', field: 'prod_name', alignment: 'left', type: 'text' },
      { header: 'Product Type', field: 'product_type_descr', alignment: 'left', type: 'text' },
      { header: 'Description', field: 'descr', alignment: 'left', type: 'text' },
      { header: 'Image', field: 'image', alignment: 'center', type: 'image' },
      { header: 'Active', field: 'is_active', alignment: 'center', type: 'boolean' },
      { header: 'Created At', field: 'createdAt', alignment: 'center', type: 'date' },
      { header: 'Updated At', field: 'updatedAt', alignment: 'center', type: 'date' }
    ]" [url]="'product/get-all'" [editButton]="true" [primaryKey]="'prod_id'" [filterField]="'prod_type_code'"
  [filterOptions]="[
    { label: 'Ecer 500', value: 'ECER500' },
    { label: 'Ecer 2000', value: 'ECER2000' },
  ]">
</app-paging>
