<app-paging [tableTitle]="'Product Records'" [addButton]="true" [columns]="[
      { header: 'Product ID', field: 'prod_id', alignment: 'left', type: 'text' },
      { header: 'Product Code', field: 'prod_code', alignment: 'left', type: 'text' },
      { header: 'Product Name', field: 'prod_name', alignment: 'left', type: 'text' },
      { header: 'Product Type Code', field: 'prod_type_code', alignment: 'left', type: 'text' },
      { header: 'Description', field: 'descr', alignment: 'left', type: 'text' },
      { header: 'Image URL', field: 'image', alignment: 'left', type: 'text' },
      { header: 'Created At', field: 'createdAt', alignment: 'left', type: 'date' },
      { header: 'Updated At', field: 'updatedAt', alignment: 'left', type: 'date' }
    ]" [url]="'product/get-all'" [editButton]="true" [primaryKey]="'prod_id'">
</app-paging>
