<app-paging [tableTitle]="'Order Records'" [addButton]="true" [columns]="[
    { header: 'Distributor ID', field: 'distributor_id', alignment: 'left', type: 'text' },
    { header: 'Distributor Name', field: 'distributor_name', alignment: 'left', type: 'text' },
    { header: 'Order Date', field: 'order_dt', alignment: 'left', type: 'date' },
    { header: 'Status', field: 'status', alignment: 'left', type: 'status' },
    { header: 'Total Price', field: 'total_price', alignment: 'left', type: 'currency' },
    { header: 'Shipment', field: 'shipment_name', alignment: 'left', type: 'text' },
    { header: 'Invoice', field: 'invoice_id', alignment: 'left', type: 'link', path: '/invoice/detail', logo: 'fa-map-marker-alt' },

  ]" [url]="'orders/get-all'" [editButton]="true" [primaryKey]="'order_id'"
  [shouldShowActionButtons]="shouldShowActionButtons" [filterField]="'status'" [filterOptions]="[
  { label: 'Active', value: ['Pending', 'Processing', 'Invoiced'], default: true },
  { label: 'Pending', value: 'Pending' },
    { label: 'Processing', value: 'Processing' },
    { label: 'Invoiced', value: 'Invoiced' },
    { label: 'Delivered', value: 'Delivered' },
    { label: 'Cancelled', value: 'Cancelled' }
  ]">
</app-paging>
